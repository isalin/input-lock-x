# Minibook X HID lock configuration.
#
# Installed to /etc/minibookx-hid-lock.conf. Not overwritten by install.sh once
# it exists, so local edits survive a reinstall.
#
# After editing, verify with:
#   sudo hid-lock-daemon --list
# and then actually start the unit -- a shell sudo can open input devices even
# when the service's SELinux domain cannot, so --list alone proves nothing.

[devices]
# fnmatch patterns matched against the evdev device name (EVIOCGNAME).
# One pattern per line. Every matching device is grabbed while locked.
#
# The Goodix Capacitive TouchScreen is deliberately absent: it stays live so
# you can always tap the panel icon to unlock in tablet mode. Add it here only
# if you have another way back in.
patterns = AT Translated Set 2 keyboard
           *Touchpad

[behaviour]
# Automatically release the lock after this many seconds. 0 disables the
# timeout (the default) -- the lock then lasts until Ctrl+Esc, the panel icon,
# or one of the scripts releases it.
max_lock_seconds = 0
