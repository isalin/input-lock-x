# Input Lock X configuration.
#
# Installed to /etc/input-lock-x.conf. Not overwritten by install.sh once it
# exists, so local edits survive a reinstall.
#
# After editing, verify with:
#   sudo input-lock-x-daemon --list
# and then actually start the unit -- a shell sudo can open input devices even
# when the service's SELinux domain cannot, so --list alone proves nothing.

[devices]
# auto      recognise the internal keyboard and touchpad from what the kernel
#           says they are (evdev capabilities and INPUT_PROP_* flags), which
#           works on hardware nobody has tested. This is the default.
# patterns  grab exactly the devices whose evdev name matches `patterns` below.
#
# Setting `patterns` without setting `mode` selects patterns mode, so configs
# written before auto detection existed keep behaving exactly as they did. That
# does not apply to this file, because `mode` is set below: uncommenting
# `patterns` further down means changing this line to `patterns` as well, or
# the list is ignored. The daemon says so in the journal if you forget.
mode = auto

# Auto mode never grabs a touchscreen: INPUT_PROP_DIRECT devices stay live so
# you can always tap the panel icon to unlock. It also leaves USB and Bluetooth
# devices alone, so an external keyboard keeps working and gives you another
# way back. Machines whose *internal* keyboard is USB-attached need this:
#include_usb = yes
#include_bluetooth = yes

# A trailing `# comment` is stripped from the single-value settings above, but
# NOT from `patterns` or `exclude` below -- a device name may contain a '#' and
# cutting one short would grab the wrong device. Comment those on their own line.
#
# Patterns mode: fnmatch patterns matched against the evdev device name
# (EVIOCGNAME), one per line. Every matching device is grabbed while locked.
#
# A pattern is an explicit instruction, so it overrides every safety rule above:
# in patterns mode there is no touchscreen exemption, no USB/Bluetooth skip and
# no virtual-device skip, and include_usb / include_bluetooth do nothing. The
# daemon warns on startup if a pattern matches a touchscreen -- that is you
# grabbing your own way back in -- but it does what you asked.
#patterns = AT Translated Set 2 keyboard
#           *Touchpad

# Never grab these, in either mode. Checked before everything else.
#exclude = *Some Device*

[behaviour]
# Automatically release the lock after this many seconds. 0 disables the
# timeout (the default) -- the lock then lasts until Ctrl+Esc, the panel icon,
# or one of the scripts releases it.
max_lock_seconds = 0
